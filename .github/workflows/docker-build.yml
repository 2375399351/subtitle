name: Build Docker Image Artifact

on:
  push:
    branches: [main, nextjs]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 清掉旧的 GHA 构建缓存，避免 pnpm 12 的缓存层继续生效
      - name: Clean buildx cache
        run: |
          docker buildx prune --all --force || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: subtitle:latest
          # 暂时去掉 cache-from / cache-to，等首次成功后再加回来
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

      - name: Save image to tar.gz
        run: |
          docker save subtitle:latest | gzip > subtitle-image.tar.gz
          ls -lh subtitle-image.tar.gz

      - name: Upload compressed image
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-image-targz
          path: subtitle-image.tar.gz
          retention-days: 30
